apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      hostNetwork: true
      serviceAccountName: tailscale-subnet-router
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:latest
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: home-k8s-connector
            - name: TS_ROUTES
              value: 10.0.0.0/24
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:k8s
            - name: TS_USERSPACE
              value: "false"
            - name: TS_KUBE_SECRET
              value: "tailscale-state"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
